<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/scroll-img/mazda-remove-bk.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No filtrar la URL completa a terceros (Google Fonts) al pedir subrecursos:
      solo se envía el origen, y nada si el destino baja a HTTP.
      La Content-Security-Policy se inyecta aquí en el build de producción
      (ver plugin `cspMeta` en vite.config.js); no se pone en el fuente porque
      el servidor de desarrollo de Vite necesita inyectar <style> en caliente.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="AXIS Motors: vehículos nuevos y usados en gama económica, media y de lujo. Toyota, Mazda, BMW, Audi, Mercedes-Benz, Porsche y más, con precios claros y atención por WhatsApp."
    />
    <meta name="theme-color" content="#0B0C10" />
    <meta name="color-scheme" content="dark" />
    <title>AXIS Motors — Vehículos nuevos y usados | Concesionario premium</title>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="AXIS Motors" />
    <meta property="og:title" content="AXIS Motors — Vehículos nuevos y usados" />
    <meta
      property="og:description"
      content="Inventario de %VEHICLE_COUNT% vehículos en tres gamas: económica, media/premium y lujo. Filtra, compara y consulta por WhatsApp."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Precarga de la imagen del Hero (candidata a LCP) -->
    <link
      rel="preload"
      as="image"
      href="/scroll-img/mazda-remove-bk.webp"
      fetchpriority="high"
    />

    <!--
      Fuentes display: carga asíncrona para no bloquear el render (FCP).
      El `preload` arranca la descarga al parsear el <head>; el cambio a
      `rel="stylesheet"` lo hace main.jsx (ver `activarFuentes`). Antes se hacía
      con un manejador `onload=` en línea, que obligaba a abrir la CSP con
      'unsafe-inline'/'unsafe-hashes' en script-src — es decir, a permitir la
      ejecución de scripts en línea, que es justo el vector principal de XSS.
      Moverlo al bundle mantiene la misma precarga y permite un script-src estricto.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="font-css"
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #c9ced6">
        AXIS Motors — concesionario de vehículos nuevos y usados. Activa JavaScript para ver el
        inventario o escríbenos por WhatsApp.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
